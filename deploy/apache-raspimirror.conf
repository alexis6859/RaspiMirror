# Impede o Apache de servir ficheiros privados do RaspiMirror (.env, .git, backend).
# Instalar:
#   sudo cp deploy/apache-raspimirror.conf /etc/apache2/conf-available/raspimirror.conf
#   sudo a2enconf raspimirror && sudo systemctl reload apache2
<Directory /var/www/html/raspimirror>
    Options -Indexes
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>
</Directory>
<DirectoryMatch "^/var/www/html/raspimirror/(\.git|\.claude|raspimirror-backend|deploy)">
    Require all denied
</DirectoryMatch>
